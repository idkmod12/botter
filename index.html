<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Launch a temporary botter payload." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1117'/%3E%3Cpath d='M18 22h28v20H18z' fill='none' stroke='%236ee7b7' stroke-width='4'/%3E%3Cpath d='M24 16v6m16-6v6M24 32h.01M32 32h.01M40 32h.01M28 40h8' stroke='%236ee7b7' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Isaiah Botter</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b10; color: #f3f7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #18302d 0, transparent 38%), #080b10; }
      main { width: min(100% - 32px, 620px); margin: 0 auto; padding: 72px 0 40px; }
      .eyebrow { color: #6ee7b7; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 12px 0 10px; font-size: clamp(2.3rem, 8vw, 4.6rem); line-height: .98; letter-spacing: -.06em; }
      .intro { margin: 0 0 34px; color: #9eaba7; font-size: 1.05rem; line-height: 1.6; }
      .panel { padding: 28px; border: 1px solid #22302d; border-radius: 24px; background: rgba(17, 24, 30, .84); box-shadow: 0 22px 70px rgba(0, 0, 0, .28); }
      form { display: grid; gap: 20px; }
      label { display: grid; gap: 8px; color: #d8e1de; font-size: .9rem; font-weight: 650; }
      input { width: 100%; border: 1px solid #344540; border-radius: 12px; background: #0c1216; color: #f3f7f5; padding: 14px 15px; font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
      input::placeholder { color: #63716d; }
      input:focus { border-color: #6ee7b7; box-shadow: 0 0 0 3px rgba(110, 231, 183, .13); }
      button { margin-top: 4px; border: 0; border-radius: 12px; padding: 15px 18px; background: #6ee7b7; color: #07110d; font: inherit; font-weight: 800; cursor: pointer; transition: transform .2s, background .2s; }
      button:hover { background: #9af1cd; transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      .hint { margin: 18px 0 0; color: #71807a; font-size: .85rem; line-height: 1.5; }
      @media (max-width: 520px) { main { padding-top: 42px; } .panel { padding: 20px; border-radius: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Isaiah Botter</div>
      <h1>Launch a payload.</h1>
      <p class="intro">Enter the three values below. Your launch will open on the data page for a few seconds, then clear itself.</p>
      <section class="panel" aria-label="Launch form">
        <form id="launch-form">
          <label for="code">Code
            <input id="code" name="code" type="text" placeholder="432 523" autocomplete="off" required />
          </label>
          <label for="amount">Amount
            <input id="amount" name="amount" type="text" inputmode="decimal" placeholder="10" autocomplete="off" required />
          </label>
          <label for="name">Name
            <input id="name" name="name" type="text" placeholder="Example" autocomplete="off" required />
          </label>
          <button type="submit">Launch</button>
        </form>
        <p class="hint">The values are kept only in this browser session and are removed when the display expires.</p>
      </section>
    </main>
    <script>
      document.getElementById('launch-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        sessionStorage.setItem('botterPayload', JSON.stringify({
          code: String(form.get('code') || '').trim(),
          amount: String(form.get('amount') || '').trim(),
          name: String(form.get('name') || '').trim(),
        }));
        window.location.href = '/data';
      });
    </script>
  </body>
</html>
