<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launched · Isaiah Botter</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b10; color: #f3f7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #18302d 0, transparent 48%), #080b10; }
      main { width: min(100%, 560px); text-align: center; }
      .status { color: #6ee7b7; font-size: .8rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 14px 0 8px; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: -.05em; }
      #message { margin: 0 0 28px; color: #9eaba7; line-height: 1.6; }
      .payload { display: grid; gap: 12px; margin: 0; text-align: left; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 20px; border: 1px solid #22302d; border-radius: 16px; background: rgba(17, 24, 30, .86); }
      dt { color: #71807a; font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; }
      dd { margin: 0; color: #f3f7f5; font-size: 1.08rem; font-weight: 700; overflow-wrap: anywhere; }
      a { display: inline-block; margin-top: 28px; color: #6ee7b7; text-decoration: none; font-weight: 700; }
      a:hover { color: #9af1cd; }
      .empty { color: #9eaba7; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Launch received</div>
      <h1>Payload is live.</h1>
      <p id="message">This data will clear in 3 seconds.</p>
      <dl id="payload" class="payload" aria-live="polite"></dl>
      <a href="/">Launch another</a>
    </main>
    <script>
      const payloadEl = document.getElementById('payload');
      const messageEl = document.getElementById('message');
      let payload = null;
      try { payload = JSON.parse(sessionStorage.getItem('botterPayload') || 'null'); } catch (_) {}
      if (!payload || !payload.code || !payload.amount || !payload.name) {
        messageEl.textContent = 'There is no active payload.';
        payloadEl.innerHTML = '<div class="empty">Return to the launch page to create one.</div>';
      } else {
        [['Code', payload.code], ['Amount', payload.amount], ['Name', payload.name]].forEach(([label, value]) => {
          const row = document.createElement('div'); row.className = 'row';
          const dt = document.createElement('dt'); dt.textContent = label;
          const dd = document.createElement('dd'); dd.textContent = value;
          row.append(dt, dd); payloadEl.appendChild(row);
        });
        window.setTimeout(() => {
          sessionStorage.removeItem('botterPayload');
          payloadEl.innerHTML = '<div class="empty">The payload has expired.</div>';
          messageEl.textContent = 'This launch has been cleared.';
        }, 3000);
      }
    </script>
  </body>
</html>
